<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перекрытие · до / после · демо 22.10</title>
<!-- 22.10 12:20 Антон: «по перекрытиям было бы круто показывать до / после одной картинкой: мышка влево — до, мышка вправо — после».
     Демо: «Бонсай» — пара, где «до» и «после» сняты почти с одного ракурса: «до» (w/bonsai/01) совмещено с «после» (04)
     по 41 общей точке (SIFT + подобие, OpenCV) и обрезано одинаково — w/bonsai/ba-*.webp; 12:21–12:22 Антон: «типа вот так и вот так» (игуана до/после) + «не обязательно прям стопроцентное попадание» → «Игуана»: «до» (01) совмещено с «после» (03) по 4 точкам стопы (перспектива), w/iguana/ba-*.webp. 12:24 «делай больше» → тигр (01→03), викинг (01→04), первый реализм (01→04) — так же по 4 точкам руки, примерно.
     Мышь: где курсор — там граница; левее границы «после», правее — «до» (курсор к левому краю — всё «до», к правому — всё «после»). Палец — тянуть. -->
<link rel="stylesheet" href="shell.css">
<style>
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Jost, sans-serif; }
.wrap { max-width: 78.75rem; margin: 5rem auto; padding: 0 1rem; } .two { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem 1.875rem; } @media (max-width: 767px) { .two { grid-template-columns: 1fr; } }
h1 { margin: 0 0 1.5rem; font: 400 2.5rem/3rem Foglihten, serif; text-transform: uppercase; color: var(--ink); }
.ba { position: relative; aspect-ratio: 4 / 5; overflow: hidden; cursor: ew-resize; touch-action: pan-y; user-select: none; --x: 50%; }
.ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.ba .af { clip-path: inset(0 calc(100% - var(--x)) 0 0); }   /* «после» — левее границы */
.ba .ln { position: absolute; top: 0; bottom: 0; left: var(--x); width: 1px; margin-left: -.5px; background: var(--gold); pointer-events: none; }
.ba .ln::after { content: ""; position: absolute; left: 50%; top: 50%; width: .75rem; height: .75rem; translate: -50% -50%; rotate: 45deg; background: var(--gold); }   /* ромб, как на сайте */
.ba .tg { position: absolute; bottom: 1rem; font: 400 .75rem/1rem Jost, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); text-shadow: 0 0 .5rem rgba(0,0,0,.6); pointer-events: none; transition: opacity .2s; }
.ba .tg.a { left: 1rem; } .ba .tg.b { right: 1rem; }
.cap { margin: 1rem 0 0; color: var(--muted); font-size: .875rem; line-height: 1.375rem; }
</style></head><body>
<div class="wrap">
  <h1>Перекрытия</h1>
  <div class="two">
  <figure style="margin:0"><div class="ba" role="img" aria-label="Перекрытие «Бонсай»: до и после">
    <img src="w/bonsai/ba-before.webp" alt=""><img class="af" src="w/bonsai/ba-after.webp" alt="">
    <span class="ln"></span><span class="tg a">После</span><span class="tg b">До</span></div>
  <p class="cap">Бонсай · ювелирно чистое перекрытие без лазера</p></figure>
  <figure style="margin:0"><div class="ba" role="img" aria-label="Перекрытие «Игуана»: до и после">
    <img src="w/iguana/ba-before.webp" alt=""><img class="af" src="w/iguana/ba-after.webp" alt="">
    <span class="ln"></span><span class="tg a">После</span><span class="tg b">До</span></div>
  <p class="cap">Игуана и пингвин · сохранил идею клиента, но сделал немного лучше, чем было</p></figure>
  <figure style="margin:0"><div class="ba" role="img" aria-label="Перекрытие «Тигр с изумрудом»: до и после">
    <img src="w/tiger/ba-before.webp" alt=""><img class="af" src="w/tiger/ba-after.webp" alt="">
    <span class="ln"></span><span class="tg a">После</span><span class="tg b">До</span></div>
  <p class="cap">Тигр с изумрудом · из старого портачка — в роскошь ар-деко</p></figure>
  <figure style="margin:0"><div class="ba" role="img" aria-label="Перекрытие «Викинг»: до и после">
    <img src="w/viking/ba-before.webp" alt=""><img class="af" src="w/viking/ba-after.webp" alt="">
    <span class="ln"></span><span class="tg a">После</span><span class="tg b">До</span></div>
  <p class="cap">Викинг · светлым можно перекрыть практически всё, вопрос только во времени</p></figure>
  <figure style="margin:0"><div class="ba" role="img" aria-label="Перекрытие «Перекрытие первого реализма»: до и после">
    <img src="w/first-realism/ba-before.webp" alt=""><img class="af" src="w/first-realism/ba-after.webp" alt="">
    <span class="ln"></span><span class="tg a">После</span><span class="tg b">До</span></div>
  <p class="cap">Перекрытие моего первого «реализма» — делал его в 2008–2009 годах близкому другу</p></figure>
  </div>
</div>
<script>
document.querySelectorAll(".ba").forEach(ba => { const ta = ba.querySelector(".tg.a"), tb = ba.querySelector(".tg.b");
  const put = cx => { const r = ba.getBoundingClientRect(), p = Math.max(0, Math.min(1, (cx - r.left) / r.width));
    ba.style.setProperty("--x", p * 100 + "%"); ta.style.opacity = p > .12 ? 1 : 0; tb.style.opacity = p < .88 ? 1 : 0; };
  ba.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons) put(e.clientX); });
  ba.addEventListener("pointerdown", e => { ba.setPointerCapture(e.pointerId); put(e.clientX); });
  ba.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { ba.style.setProperty("--x", "50%"); ta.style.opacity = tb.style.opacity = 1; } }); });
</script>
</body></html>
